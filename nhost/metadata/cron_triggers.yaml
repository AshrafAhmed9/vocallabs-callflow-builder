- name: cron_tick
  webhook: "{{NHOST_FUNCTIONS_URL}}/cron-tick"
  schedule: "*/5 * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 1
    timeout_seconds: 60
    tolerance_seconds: 21600
    retry_interval_seconds: 10
  headers: []
  comment: Polls scheduled workflow triggers every 5 minutes and starts due runs.

type Mutation {
  approveStep(
    step_run_id: uuid!
  ): ApproveStepOutput!
}

type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
  ): TriggerRunOutput!
}

type Mutation {
  webhookTriggerRun(
    workflow_id: uuid!
    token: uuid!
    payload: json
  ): TriggerRunOutput!
}

type TriggerRunOutput {
  run_id: uuid!
  status: String!
}

type ApproveStepOutput {
  step_run_id: uuid!
  status: String!
  run_status: String!
}


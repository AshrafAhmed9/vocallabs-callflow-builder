table:
  name: inbound_calls
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: owner
    permission:
      check:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      columns:
        - org_id
        - caller_number
        - transcript
        - workflow_id
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - org_id
        - caller_number
        - transcript
        - workflow_id
        - created_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
  - role: owner
    permission:
      columns:
        - id
        - org_id
        - caller_number
        - transcript
        - workflow_id
        - created_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - org_id
        - caller_number
        - transcript
        - workflow_id
        - created_at
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: inbound_calls_on_insert
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{NHOST_FUNCTIONS_URL}}/on-inbound-call'

table:
  name: org_usage_current_period
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: editor
    permission:
      columns:
        - org_id
        - quota_used
        - quota_limit
        - runs_this_month
        - avg_run_duration_seconds
        - avg_step_latency_ms
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
  - role: owner
    permission:
      columns:
        - org_id
        - quota_used
        - quota_limit
        - runs_this_month
        - avg_run_duration_seconds
        - avg_step_latency_ms
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: viewer
    permission:
      columns:
        - org_id
        - quota_used
        - quota_limit
        - runs_this_month
        - avg_run_duration_seconds
        - avg_step_latency_ms
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id

table:
  schema: public
  name: org_usage_current_period
  is_enum: false
configuration:
  custom_root_fields: {}
  custom_column_names: {}
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: organizations
        column_mapping:
          org_id: id
select_permissions:
  - role: owner
    permission:
      columns: [org_id, quota_used, quota_limit, runs_this_month, avg_run_duration_seconds, avg_step_latency_ms]
      filter:
        organization:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
  - role: editor
    permission:
      columns: [org_id, quota_used, quota_limit, runs_this_month, avg_run_duration_seconds, avg_step_latency_ms]
      filter:
        organization:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
  - role: viewer
    permission:
      columns: [org_id, quota_used, quota_limit, runs_this_month, avg_run_duration_seconds, avg_step_latency_ms]
      filter:
        organization:
          members:
            user_id: { _eq: X-Hasura-User-Id }

table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - triggered_by
        - trigger_type
        - started_at
        - finished_at
        - dedupe_key
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
  - role: owner
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - triggered_by
        - trigger_type
        - started_at
        - finished_at
        - dedupe_key
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - triggered_by
        - trigger_type
        - started_at
        - finished_at
        - dedupe_key
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id

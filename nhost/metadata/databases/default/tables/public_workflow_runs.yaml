table:
  schema: public
  name: workflow_runs
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: org
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        table:
          schema: public
          name: step_runs
        column: workflow_run_id
select_permissions:
  - role: owner
    permission:
      columns: [id, workflow_id, org_id, status, triggered_by, trigger_type, started_at, finished_at, dedupe_key]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
  - role: editor
    permission:
      columns: [id, workflow_id, org_id, status, triggered_by, trigger_type, started_at, finished_at, dedupe_key]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
  - role: viewer
    permission:
      columns: [id, workflow_id, org_id, status, triggered_by, trigger_type, started_at, finished_at, dedupe_key]
      filter:
        org:
          members:
            user_id: { _eq: X-Hasura-User-Id }
# No insert/update/delete permissions for owner/editor/viewer: workflow_runs
# are only ever created/mutated server-side (admin client) via the
# triggerWorkflowRun / webhookTriggerRun / approveStep actions and the
# executor, which re-derive org membership themselves before writing.

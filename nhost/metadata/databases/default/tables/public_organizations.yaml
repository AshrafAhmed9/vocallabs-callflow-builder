table:
  name: organizations
  schema: public
object_relationships:
  - name: usage
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_current_period
          schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - name
        - quota_limit
        - quota_used
        - period_start
        - created_at
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _in:
                  - owner
                  - editor
  - role: owner
    permission:
      columns:
        - id
        - name
        - quota_limit
        - quota_used
        - period_start
        - created_at
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - name
        - quota_limit
        - quota_used
        - period_start
        - created_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id

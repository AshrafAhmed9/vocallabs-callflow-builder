table:
  name: crm_pushes
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - org_id
        - step_run_id
        - payload
        - created_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
  - role: owner
    permission:
      columns:
        - id
        - org_id
        - step_run_id
        - payload
        - created_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - org_id
        - step_run_id
        - payload
        - created_at
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id

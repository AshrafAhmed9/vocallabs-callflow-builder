table:
  schema: public
  name: crm_pushes
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: owner
    permission:
      columns: [id, org_id, step_run_id, payload, created_at]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
  - role: editor
    permission:
      columns: [id, org_id, step_run_id, payload, created_at]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
  - role: viewer
    permission:
      columns: [id, org_id, step_run_id, payload, created_at]
      filter:
        org:
          members:
            user_id: { _eq: X-Hasura-User-Id }

table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - type:
              _nin:
                - db_write
                - notify
      columns:
        - workflow_id
        - position
        - type
        - name
        - config
  - role: owner
    permission:
      check:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      columns:
        - workflow_id
        - position
        - type
        - name
        - config
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - position
        - type
        - name
        - config
        - created_at
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
  - role: owner
    permission:
      columns:
        - id
        - workflow_id
        - position
        - type
        - name
        - config
        - created_at
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - workflow_id
        - position
        - type
        - name
        - config
        - created_at
      filter:
        workflow:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: editor
    permission:
      columns:
        - position
        - name
        - config
      filter:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - type:
              _nin:
                - db_write
                - notify
      check:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - type:
              _nin:
                - db_write
                - notify
  - role: owner
    permission:
      columns:
        - position
        - type
        - name
        - config
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      check: null
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner

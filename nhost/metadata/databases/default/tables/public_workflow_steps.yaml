table:
  schema: public
  name: workflow_steps
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        table:
          schema: public
          name: step_runs
        column: step_id
select_permissions:
  - role: owner
    permission:
      columns: [id, workflow_id, position, type, name, config, created_at]
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
  - role: editor
    permission:
      columns: [id, workflow_id, position, type, name, config, created_at]
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
  - role: viewer
    permission:
      columns: [id, workflow_id, position, type, name, config, created_at]
      filter:
        workflow:
          org:
            members:
              user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: owner
    permission:
      columns: [workflow_id, position, type, name, config]
      check:
        workflow:
          org:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
  - role: editor
    permission:
      columns: [workflow_id, position, type, name, config]
      check:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: [owner, editor] }
          - type: { _nin: [db_write, notify] }
update_permissions:
  - role: owner
    permission:
      columns: [position, type, name, config]
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
      check: null
  - role: editor
    permission:
      columns: [position, name, config]
      filter:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: [owner, editor] }
          - type: { _nin: [db_write, notify] }
      check:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: [owner, editor] }
          - type: { _nin: [db_write, notify] }
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }

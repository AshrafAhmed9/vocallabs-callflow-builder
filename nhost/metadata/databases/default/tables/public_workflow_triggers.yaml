table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - type:
              _neq: webhook
      columns:
        - workflow_id
        - type
        - config
        - enabled
  - role: owner
    permission:
      check:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      columns:
        - workflow_id
        - type
        - config
        - enabled
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - enabled
        - created_at
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
  - role: owner
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - webhook_token
        - enabled
        - created_at
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - enabled
        - created_at
      filter:
        workflow:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: editor
    permission:
      columns:
        - config
        - enabled
      filter:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - type:
              _neq: webhook
      check:
        _and:
          - workflow:
              org:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - type:
              _neq: webhook
  - role: owner
    permission:
      columns:
        - type
        - config
        - enabled
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      check: null
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          org:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner

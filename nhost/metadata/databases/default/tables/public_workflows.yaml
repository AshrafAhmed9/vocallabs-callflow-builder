table:
  schema: public
  name: workflows
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        table:
          schema: public
          name: workflow_steps
        column: workflow_id
  - name: triggers
    using:
      foreign_key_constraint_on:
        table:
          schema: public
          name: workflow_triggers
        column: workflow_id
  - name: runs
    using:
      foreign_key_constraint_on:
        table:
          schema: public
          name: workflow_runs
        column: workflow_id
select_permissions:
  - role: owner
    permission:
      columns: [id, org_id, name, description, created_by, created_at, updated_at]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
  - role: editor
    permission:
      columns: [id, org_id, name, description, created_by, created_at, updated_at]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
  - role: viewer
    permission:
      columns: [id, org_id, name, description, created_by, created_at, updated_at]
      filter:
        org:
          members:
            user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: owner
    permission:
      columns: [org_id, name, description, created_by]
      check:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
  - role: editor
    permission:
      columns: [org_id, name, description, created_by]
      check:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
update_permissions:
  - role: owner
    permission:
      columns: [name, description]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
      check: null
  - role: editor
    permission:
      columns: [name, description]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      check: null
delete_permissions:
  - role: owner
    permission:
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }

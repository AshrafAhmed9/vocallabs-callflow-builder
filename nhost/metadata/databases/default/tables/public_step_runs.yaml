table:
  name: step_runs
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - org_id
        - status
        - input
        - output
        - error
        - attempt
        - latency_ms
        - tokens_used
        - approved_by
        - approved_at
        - started_at
        - finished_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
  - role: owner
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - org_id
        - status
        - input
        - output
        - error
        - attempt
        - latency_ms
        - tokens_used
        - approved_by
        - approved_at
        - started_at
        - finished_at
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: viewer
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - org_id
        - status
        - input
        - output
        - error
        - attempt
        - latency_ms
        - tokens_used
        - approved_by
        - approved_at
        - started_at
        - finished_at
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id

actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/approve-step'
      forward_client_headers: true
      timeout: 60
    permissions:
      - role: owner
      - role: editor
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/trigger-workflow-run'
      forward_client_headers: true
      timeout: 60
    permissions:
      - role: owner
      - role: editor
  - name: webhookTriggerRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/webhook-trigger'
      timeout: 60
    permissions:
      - role: public
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerRunOutput
    - name: ApproveStepOutput
  scalars: []

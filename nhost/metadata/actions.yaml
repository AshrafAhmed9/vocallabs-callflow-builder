actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/trigger-workflow-run"
      forward_client_headers: true
      timeout: 60
    permissions:
      - role: owner
      - role: editor
  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approve-step"
      forward_client_headers: true
      timeout: 60
    permissions:
      - role: owner
      - role: editor
  - name: webhookTriggerRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/webhook-trigger"
      forward_client_headers: false
      timeout: 60
    permissions:
      - role: public
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerRunOutput
      fields:
        - name: run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: step_run_id
          type: uuid!
        - name: status
          type: String!
        - name: run_status
          type: String!
  scalars: []
